<div class="c-identity">
  <div class="c-identity-main">
    <span class="c-character-name">{{ character()?.bio?.name || '—' }}</span>
    <span class="c-identity-sub">
      {{ speciesLabel() || '—' }}
      @if (professionLabel()) {
        <span class="c-identity-sep">·</span>
        {{ professionLabel() }}
      }
    </span>
    <span class="c-identity-ap" [class.c-identity-ap-negative]="ap().available < 0">
      <strong>{{ ap().available }}</strong> AP verfügbar
    </span>
  </div>

  <div class="c-export-actions">
    <button
      type="button"
      pButton
      class="c-export-btn"
      (click)="exportPdf()"
      pTooltip="Als PDF-Bogen exportieren (Pergament, mit eingebettetem Charakter zum Re-Import)"
      tooltipPosition="bottom"
      text
      size="small"
      iconOnly
    ><i class="pi pi-file-pdf"></i></button>
    <button
      type="button"
      pButton
      class="c-export-btn"
      (click)="exportPdfWhite()"
      pTooltip="Als PDF-Bogen exportieren (weißer Hintergrund, druckfreundlich)"
      tooltipPosition="bottom"
      text
      size="small"
      iconOnly
    ><i class="pi pi-print"></i></button>
    <button
      type="button"
      pButton
      class="c-export-btn"
      (click)="exportJson()"
      pTooltip="Als JSON exportieren"
      tooltipPosition="bottom"
      text
      size="small"
      iconOnly
    ><i class="pi pi-download"></i></button>
  </div>
</div>
