<p-accordion [multiple]="true" [value]="openPanels()" (valueChange)="onPanelsChange($event)">
  @for (cat of categories(); track cat.key) {
    <p-accordion-panel [value]="cat.key">
      <p-accordion-header>{{ cat.label }}</p-accordion-header>

      <p-accordion-content>
        <div class="c-table-wrap">
          <p-table [value]="cat.rows" [tableStyle]="{ width: '100%' }" styleClass="c-sheet-table">
            <ng-template #header>
              <tr>
                <th class="c-th">Talent</th>
                <th class="c-th c-th-narrow c-hide-sm">P1</th>
                <th class="c-th c-th-narrow c-hide-sm">P2</th>
                <th class="c-th c-th-narrow c-hide-sm">P3</th>
                <th class="c-th c-th-narrow"></th>
                <th class="c-th c-th-narrow c-hide-sm">SF</th>
                <th class="c-th c-th-narrow">FW</th>
                <th class="c-th c-th-narrow c-hide-md">Routine</th>
              </tr>
            </ng-template>

            <ng-template #body let-row>
              <tr>
                <!-- Talent name -->
                <td class="c-td">
                  <span class="c-cell-text">{{ row.def.label }}</span>
                </td>

                <!-- Probe 1 -->
                <td class="c-td c-td-center c-hide-sm">
                  <span class="c-cell-text">{{ row.def.check[0] }}</span>
                </td>

                <!-- Probe 2 -->
                <td class="c-td c-td-center c-hide-sm">
                  <span class="c-cell-text">{{ row.def.check[1] }}</span>
                </td>

                <!-- Probe 3 -->
                <td class="c-td c-td-center c-hide-sm">
                  <span class="c-cell-text">{{ row.def.check[2] }}</span>
                </td>

                <!-- Roll check button -->
                <td class="c-td c-td-roll">
                  <app-d20-roll
                    [label]="row.def.check[0] + '/' + row.def.check[1] + '/' + row.def.check[2] + ' Probe'"
                    (roll)="rollCheck(row.def.check)"
                  />
                </td>

                <!-- Steigerungsfaktor -->
                <td class="c-td c-td-center c-hide-sm">
                  <span class="c-cell-text">{{ row.def.increaseFactor }}</span>
                </td>

                <!-- FW (editable) -->
                <td class="c-td c-td-center">
                  <p-inputnumber
                    [ngModel]="row.fw"
                    (ngModelChange)="pendingFw[cat.key + ':' + row.def.name] = $event"
                    (onBlur)="commitPendingFw(cat.key, row.def)"
                    [min]="0"
                    [max]="25"
                    [showButtons]="false"
                    [useGrouping]="false"
                    class="w-full"
                  />
                </td>

                <!-- Routine -->
                <td class="c-td c-td-center c-hide-md">
                  <span class="c-cell-text">{{ getRoutine(cat.key, row.def) }}</span>
                </td>
              </tr>
            </ng-template>
          </p-table>
        </div>
      </p-accordion-content>
    </p-accordion-panel>
  }
</p-accordion>
