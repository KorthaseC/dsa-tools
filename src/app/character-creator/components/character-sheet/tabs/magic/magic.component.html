<p-table
    [value]="magicRows()"
    [tableStyle]="{ 'min-width': '38rem', 'table-layout': 'fixed' }"
    class="c-sheet-table"
    (onRowReorder)="onRowReorder($event)"
    dataKey="id"
    [expandedRowKeys]="expandedRows()"
    (expandedRowKeysChange)="onExpandedRowsChange($any($event))"
    [rowTrackBy]="trackById"
  >
    <ng-template #header>
      <tr>
        <th style="width: 3rem"></th>
        <th>{{ labels().name }}</th>
        <th style="width: 4rem">P1</th>
        <th style="width: 4rem">P2</th>
        <th style="width: 4rem">P3</th>
        <th style="width: 2rem"></th>
        <th style="width: 3.5rem">FW</th>
        <th style="width: 2rem"></th>
      </tr>
    </ng-template>

    <ng-template #body let-row let-index="rowIndex" let-expanded="expanded">
      <tr [pReorderableRow]="index">
        <!-- Expand toggle + drag handle / touch reorder -->
        <td class="c-td-center">
          <div class="c-cell-actions">
            <button type="button" class="c-expand-btn" [pRowToggler]="row">
              <i [class]="expanded ? 'pi pi-chevron-down' : 'pi pi-chevron-right'"></i>
            </button>
            <span class="pi pi-bars c-drag-handle" pReorderableRowHandle></span>
            <div class="c-reorder-touch">
              <button class="c-move-btn" type="button" (click)="moveRowUp(index)" [disabled]="index === 0">
                <i class="pi pi-chevron-up"></i>
              </button>
              <button class="c-move-btn" type="button" (click)="moveRowDown(index)" [disabled]="index === magicRows().length - 1">
                <i class="pi pi-chevron-down"></i>
              </button>
            </div>
          </div>
        </td>

        <!-- Zauber / Ritual name -->
        <td>
          <p-select
            [ngModel]="row.spellName"
            (ngModelChange)="onSpellSelect(row.id, $event)"
            [options]="spellOptions()"
            optionLabel="label"
            optionValue="value"
            [placeholder]="labels().selectPlaceholder"
            [filter]="true"
            filterBy="label"
            [virtualScroll]="true"
            [virtualScrollItemSize]="38"
            appendTo="body"
            class="w-full"
          />
        </td>

        <!-- P1 -->
        <td class="c-td-center">
          <span class="c-cell-text">{{ row.probe[0] }}</span>
        </td>

        <!-- P2 -->
        <td class="c-td-center">
          <span class="c-cell-text">{{ row.probe[1] }}</span>
        </td>

        <!-- P3 -->
        <td class="c-td-center">
          <span class="c-cell-text">{{ row.probe[2] }}</span>
        </td>

        <!-- Roll check button -->
        <td class="c-td-center c-td-roll">
          <app-d20-roll
            [disabled]="!row.probe[0]"
            [label]="row.probe[0] ? row.probe[0] + '/' + row.probe[1] + '/' + row.probe[2] + ' Probe' : labels().selectPlaceholder"
            (roll)="rollCheck(row.probe)"
          />
        </td>

        <!-- FW (editable) -->
        <td class="c-td-center">
          <p-inputnumber
            [ngModel]="row.fw"
            (ngModelChange)="updateField(row.id, 'fw', $event ?? 0)"
            [min]="0"
            [max]="25"
            [showButtons]="false"
            [useGrouping]="false"
            class="w-full"
          />
        </td>

        <!-- Delete -->
        <td class="c-td-center">
          <button class="c-delete-btn" type="button" (click)="confirmDelete(row.id, $event)" pTooltip="Zeile entfernen" tooltipPosition="top">
            <i class="pi pi-times"></i>
          </button>
        </td>
      </tr>
    </ng-template>

    <ng-template #expandedrow let-row>
      <tr>
        <td colspan="8" class="c-expansion-cell">
          <div class="c-detail-grid">
            <!-- ── Row 1: detail fields ── -->
            <div class="c-detail-row-1">
              <div class="c-detail-field c-df-s">
                <label>Kosten</label>
                <input pInputText [value]="row.cost" [disabled]="true" placeholder="–" [pTooltip]="row.cost || ''" tooltipPosition="top" class="w-full" />
              </div>
              <div class="c-detail-field c-df-s">
                <label>{{ labels().castTime }}</label>
                <input pInputText [value]="row.castTime" [disabled]="true" placeholder="–" [pTooltip]="row.castTime || ''" tooltipPosition="top" class="w-full" />
              </div>
              <div class="c-detail-field c-df-s">
                <label>Reichweite</label>
                <input pInputText [value]="row.range" [disabled]="true" placeholder="–" [pTooltip]="row.range || ''" tooltipPosition="top" class="w-full" />
              </div>
              <div class="c-detail-field c-df-s">
                <label>Wirkungsdauer</label>
                <input pInputText [value]="row.duration" [disabled]="true" placeholder="–" [pTooltip]="row.duration || ''" tooltipPosition="top" class="w-full" />
              </div>
              <div class="c-detail-field c-df-m">
                <label>Zielkategorie</label>
                <input pInputText [value]="row.target" [disabled]="true" placeholder="–" [pTooltip]="row.target || ''" tooltipPosition="top" class="w-full" />
              </div>
              <div class="c-detail-field c-df-l">
                <label>{{ labels().trait }}</label>
                <input pInputText [value]="row.trait" [disabled]="true" placeholder="–" [pTooltip]="row.trait || ''" tooltipPosition="top" class="w-full" />
              </div>
              <div class="c-detail-field c-df-xs">
                <label>SF</label>
                <input pInputText [value]="row.increaseFactor" [disabled]="true" placeholder="–" class="w-full" />
              </div>
              <div class="c-detail-field c-df-m">
                <label>Seite / Regelwerk</label>
                <div class="c-detail-source">
                  <input pInputText [value]="row.page" [disabled]="true" placeholder="–" [pTooltip]="row.page || ''" tooltipPosition="top" class="w-full" />
                  <app-rule-link [url]="ruleUrl(row)" />
                </div>
              </div>
            </div>

            <!-- ── Row 2: Zaubererweiterungen ── -->
            <div class="c-erweiterungen">
              <div class="c-erweiterungen-header">
                <span>{{ labels().extensions }}</span>
              </div>

              @if (catalogExtensions(row).length > 0) {
                <div class="c-ext-add">
                  <p-select
                    appActionSelect
                    [ngModel]="null"
                    (ngModelChange)="addExtensionByName(row.id, $event)"
                    [options]="extOptions(row)"
                    optionLabel="label"
                    optionValue="value"
                    placeholder="Erweiterung hinzufügen …"
                    emptyMessage="Alle Erweiterungen gewählt"
                    appendTo="body"
                    [fluid]="true"
                    class="w-full"
                  />
                </div>
              } @else {
                <span class="c-ext-empty">Keine Erweiterungen verfügbar</span>
              }

              @for (ext of getExtensions(row); track ext.id) {
                <div class="c-erweiterung-item">
                  <input pInputText [value]="extLabel(row, ext.name)" [disabled]="true" placeholder="Erweiterung" class="c-ext-name" />
                  <button
                    class="c-delete-btn c-ext-delete-btn"
                    type="button"
                    (click)="removeExtension(row.id, ext.id)"
                    pTooltip="Erweiterung entfernen"
                    tooltipPosition="top"
                  >
                    <i class="pi pi-times"></i>
                  </button>
                </div>
              }
            </div>
          </div>
        </td>
      </tr>
    </ng-template>
  </p-table>

<div class="c-add-row">
  <button pButton type="button" [label]="labels().addButton" icon="pi pi-plus" class="p-button-text p-button-sm" (click)="addRow()"></button>
</div>

<p-confirmpopup />
